<!-- Configuracao centralizada do grupo "default" (aplicada aos agentes Server e Cliente) -->
<agent_config>
  <!-- FIM: integridade de arquivos em /etc e /var/www, em tempo real -->
  <syscheck>
    <frequency>300</frequency>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/var/www</directories>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <ignore>/etc/hosts</ignore>
    <ignore>/etc/hostname</ignore>
  </syscheck>

  <!-- Logs de autenticacao (SSH) e do Nginx -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>
</agent_config>
